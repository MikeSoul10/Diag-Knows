# PostgreSQL local para desarrollo y pruebas de integración (opcional).
#
#   docker compose up -d
#   DATABASE_URL=postgres://diag:diag@localhost:5433/asistente_cronicas  npm run db:migrate
#   TEST_DATABASE_URL=postgres://diag:diag@localhost:5433/asistente_cronicas_test  npm test
#
# Credenciales ficticias, solo para la máquina local. Nunca se usan en producción.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diag
      POSTGRES_PASSWORD: diag
      POSTGRES_DB: asistente_cronicas
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diag -d asistente_cronicas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
