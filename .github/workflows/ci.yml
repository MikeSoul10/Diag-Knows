name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diag
          POSTGRES_PASSWORD: diag
          POSTGRES_DB: asistente_cronicas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diag -d asistente_cronicas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Credenciales ficticias del contenedor de CI; no hay secretos reales aquí.
      TEST_DATABASE_URL: postgres://diag:diag@localhost:5432/asistente_cronicas_test
      USE_MOCK_AI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Pruebas (unitarias + integración con PostgreSQL)
        run: npm test
